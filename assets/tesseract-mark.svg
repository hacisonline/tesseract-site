<svg viewBox="0 0 320 320" width="320" height="320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tesseract">
  <!-- Official Tesseract brand mark: isometric cube-within-cube. Blue outer + green inner. Canonical geometry, do not alter. -->
  <g fill="none" stroke="#4A9EF5" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="160 28 284 100 284 220 160 292 36 220 36 100"/>
    <line x1="160" y1="28" x2="160" y2="292"/>
    <line x1="36" y1="100" x2="160" y2="160"/>
    <line x1="284" y1="100" x2="160" y2="160"/>
    <line x1="36" y1="220" x2="160" y2="160"/>
    <line x1="284" y1="220" x2="160" y2="160"/>
  </g>
  <g fill="none" stroke="#66CC6A" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="160 82 220 116 220 206 160 240 100 206 100 116"/>
    <line x1="160" y1="82" x2="160" y2="240"/>
    <line x1="100" y1="116" x2="160" y2="160"/>
    <line x1="220" y1="116" x2="160" y2="160"/>
    <line x1="100" y1="206" x2="160" y2="160"/>
    <line x1="220" y1="206" x2="160" y2="160"/>
  </g>
</svg>
